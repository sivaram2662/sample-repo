name: Deploy with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Push Docker Image
    runs-on: self-hosted

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECR_REGISTRY: ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Runner
        run: |
          echo "Self-hosted runner is working"
          whoami
          hostname
          docker --version

      - name: Verify Docker Access
        run: |
          docker ps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-app-image:3 .

      - name: Check Docker Images
        run: |
          docker images

      - name: Remove Old Test Container
        run: |
          docker rm -f my-app-test || true

      - name: Run Test Container
        run: |
          docker run -d \
            --name my-app-test-4567\
            -p 8088:80 \
            my-app-image:3

      - name: Verify Running Containers
        run: |
          docker ps

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        run: |
          docker tag my-app-image:3 $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag my-app-image:3 $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Docker Image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Show Pushed Image
        run: |
          echo "Pushed:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"