name: Deploy with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Verify Self-Hosted Runner
    runs-on: self-hosted

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECR_REGISTRY: ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Runner
        run: |
          echo "Self-hosted runner is working"
          whoami
          docker --version

  test:
    name: Build Docker Image
    runs-on: self-hosted
    needs: deploy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Access
        run: |
          docker ps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-app-image:3 .

      - name: Check Docker Images
        run: |
          docker images

      - name: Run Test Container
        run: |
          docker run -d \
            --name my-app-test123 \
            -p 8082:80 \
            my-app-image:3

      - name: Verify Docker Access
        run: |
          docker ps 

        