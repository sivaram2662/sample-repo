name: Deploy with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Verify Self-Hosted Runner
    runs-on: self-hosted

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECR_REGISTRY: ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Runner
        run: |
          echo "Self-hosted runner is working"
          whoami
          docker --version

  test:
    name: Build Docker Image
    runs-on: self-hosted
    needs: deploy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Access
        run: |
          docker ps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-app-image:3 .

      - name: Check Docker Images
        run: |
          docker images

      - name: Run Test Container
        run: |
          docker run -d \
            --name my-app-test1245 \
            -p 8085:80 \
            my-app-image:3

      - name: Verify Docker Access
        run: |
          docker ps 

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        run: |
          docker tag my-app-image:3 $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker Image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      